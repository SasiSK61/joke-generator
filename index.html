<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>😂 Joke Generator</h1>
            <p>Get a random joke to brighten your day!</p>
        </div>

        <!-- Joke Display -->
        <div class="joke-card">
            <div class="joke-content">
                <p id="joke-text" class="joke-text">Click "Get Joke" to start laughing!</p>
                <p id="joke-type" class="joke-type"></p>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="get-joke-btn" class="btn btn-primary">Get Joke</button>
            <button id="copy-btn" class="btn btn-secondary">Copy Joke</button>
            <button id="share-btn" class="btn btn-secondary">Share</button>
        </div>

        <!-- Joke Category Filter -->
        <div class="filters">
            <label for="category-select">Category:</label>
            <select id="category-select">
                <option value="any">Any</option>
                <option value="general">General</option>
                <option value="programming">Programming</option>
                <option value="knock-knock">Knock-knock</option>
            </select>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Loading joke...</p>
        </div>

        <!-- Error Message -->
        <div id="error" class="error hidden">
            <p id="error-text"></p>
        </div>

        <!-- Joke History -->
        <div class="history-section">
            <h3>Recent Jokes</h3>
            <ul id="joke-history" class="joke-history">
                <li class="empty-history">No jokes yet. Get started!</li>
            </ul>
            <button id="clear-history-btn" class="btn btn-danger hidden">Clear History</button>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Using <a href="https://official-joke-api.appspot.com" target="_blank">Official Joke API</a></p>
            <p>&copy; <span id="year"></span> Joke Generator. Built with ❤️</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
